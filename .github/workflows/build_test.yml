name: Build and Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never let the go command swap toolchains behind our back. The version
  # installed by setup-go is the version that builds, or the job fails loudly.
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libflac-dev libogg-dev libvorbis-dev

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      # One pass instead of two: race and coverage in the same run.
      - name: Test with race and coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Stamps the commit into the binary so a PR artifact can be traced
      # back to the exact commit that produced it.
      - name: Build
        env:
          ORPHEUS_VERSION: ${{ github.sha }}
        run: go build -ldflags "-X main.version=$ORPHEUS_VERSION" -o orpheus ./cmd/orpheus

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: orpheus-linux-amd64
          path: orpheus
          retention-days: 7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libflac-dev libogg-dev libvorbis-dev

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.3
          args: --timeout=5m
